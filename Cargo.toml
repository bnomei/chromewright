[package]
name = "chromewright"
version = "0.8.0"
edition = "2024"
authors = ["Bruno Meilick"]
description = "Browser automation MCP server via Chrome DevTools Protocol (CDP)"
readme = "README.md"
homepage = "https://github.com/bnomei/chromewright"
documentation = "https://docs.rs/chromewright"
license = "MIT"
repository = "https://github.com/bnomei/chromewright"
keywords = ["browser", "automation", "cdp", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
rust-version = "1.88"
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[[bin]]
name = "chromewright"
path = "src/bin/mcp_server.rs"
required-features = ["mcp-server"]

[features]
default = ["mcp-server", "tui"]
tokio = ["dep:tokio"]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:toml",
    "dep:base64",
    # The managed TUI browser session policy is a clap value enum. Keeping this
    # here makes `--no-default-features --features tui` a coherent library build.
    "dep:clap",
    # The TUI companion is part of this feature's public runtime, including
    # its bounded MCP resources and loopback HTTP transport.
    "mcp-handler",
    "rmcp/transport-streamable-http-server",
    "tokio",
    "dep:axum",
    "dep:fs2",
]
mcp-handler = ["rmcp/macros", "rmcp/server"]
mcp-server = [
    "mcp-handler",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
    "tokio",
    "dep:clap",
    "dep:axum",
    "dep:env_logger",
]

[dependencies]
headless_chrome = "=1.0.22"
rmcp = { version = "2.2", default-features = false }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
schemars = "1.1"
async-trait = "0.1"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "net",
    "signal",
], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
log = "0.4"
env_logger = { version = "0.11", optional = true }
html2md = "0.2"
ureq = "3.3"
tempfile = "3"
# Terminal UI (MSRV 1.88). Enabled by default; omit it with
# `--no-default-features` for a minimal library build.
ratatui = { version = "0.30", optional = true, default-features = false, features = [
    "std",
    "crossterm",
] }
crossterm = { version = "0.28", optional = true }
toml = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
urlencoding = "2.1"
